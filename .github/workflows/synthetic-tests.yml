name: Synthetic-truth tests

# Runs the unit tests and the end-to-end tests on simulated data with planted
# copy-number truth (tests/synthetic). On a pull request the synthetic tests
# also run against the base branch's package, and the job summary shows every
# metric side by side with the change, plus a figure in the synthetic-report
# artifact.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SYNTHETIC_N_CORES: "4"

jobs:
  tests:
    name: Tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('["head", "base"]') || fromJSON('["head"]') }}
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out the base branch
        if: matrix.target == 'base'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: head/pyproject.toml

      - name: Install the ${{ matrix.target }} package
        run: python -m pip install ./${{ matrix.target }} pytest

      - name: Unit tests
        if: matrix.target == 'head'
        working-directory: head
        run: python -m pytest tests --ignore=tests/synthetic -q -p no:cacheprovider

      # The tests always come from this branch; only the package under test
      # changes. Running them from outside both checkouts makes sure they
      # import the installed package, not a source tree.
      - name: Synthetic-truth tests
        continue-on-error: ${{ matrix.target == 'base' }}
        env:
          SYNTHETIC_METRICS_JSON: ${{ runner.temp }}/metrics/${{ matrix.target }}.json
        run: |
          cp -r head/tests/synthetic "$RUNNER_TEMP/synthetic"
          cd "$RUNNER_TEMP/synthetic"
          python -m pytest . -v -p no:cacheprovider

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-metrics-${{ matrix.target }}
          path: ${{ runner.temp }}/metrics/${{ matrix.target }}.json
          if-no-files-found: warn

  report:
    name: Metrics report
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/synthetic

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install matplotlib

      - uses: actions/download-artifact@v4
        with:
          pattern: synthetic-metrics-*
          path: metrics
          merge-multiple: true

      - name: Write the job summary
        run: |
          mkdir -p report
          if [ ! -f metrics/head.json ]; then
            echo "The synthetic tests on this branch produced no metrics; see the Tests (head) job." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python tests/synthetic/report.py metrics/head.json --base metrics/base.json \
            --markdown report/summary.md --figure report/curves.png \
            --figure-note "Drift and dose-response curves are in the **synthetic-report** artifact (curves.png)."
          cp metrics/*.json report/
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report
          path: report
          if-no-files-found: ignore
